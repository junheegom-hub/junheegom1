
name: Build Windows EXE and macOS DMG

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build EXE
        run: npx electron-builder --win --publish never

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: button-app-windows
          path: dist/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build DMG
        run: npx electron-builder --mac dmg --universal --publish never

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: button-app-macos
          path: dist/*.dmg
